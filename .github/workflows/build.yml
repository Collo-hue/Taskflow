name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Build every zip
        run: |
          mkdir -p out
          for z in *.zip; do
            name="${z%.zip}"
            mkdir -p "work/$name"
            unzip -q "$z" -d "work/$name"
            dir=$(dirname "$(find "work/$name" -maxdepth 3 -name settings.gradle | head -1)")
            (cd "$dir" && gradle assembleDebug)
            cp "$dir/app/build/outputs/apk/debug/app-debug.apk" "out/$name.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: out/*.apk
